<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Rubik's Solver</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.05);
            --neon-blue: #3b82f6;
            --neon-green: #10b981;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background: #4e54c8;  
            background: -webkit-linear-gradient(to left, #8f94fb, #4e54c8);  
            background: linear-gradient(to left, #0f172a, #1e1b4b); /* Dark AI Theme */
            color: white;
            text-align: center;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* --- ANIMATED BACKGROUND SQUARES --- */
        .area {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1; /* back side */
        }

        .circles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .circles li {
            position: absolute;
            display: block;
            list-style: none;
            width: 20px;
            height: 20px;
            background: rgba(255, 255, 255, 0.1); /* Transparent Cube */
            animation: animate 25s linear infinite;
            bottom: -150px;
            border-radius: 4px; /* square look */
        }

        /* Random Positions & Sizes for Background Cubes */
        .circles li:nth-child(1){ left: 25%; width: 80px; height: 80px; animation-delay: 0s; }
        .circles li:nth-child(2){ left: 10%; width: 20px; height: 20px; animation-delay: 2s; animation-duration: 12s; }
        .circles li:nth-child(3){ left: 70%; width: 20px; height: 20px; animation-delay: 4s; }
        .circles li:nth-child(4){ left: 40%; width: 60px; height: 60px; animation-delay: 0s; animation-duration: 18s; }
        .circles li:nth-child(5){ left: 65%; width: 20px; height: 20px; animation-delay: 0s; }
        .circles li:nth-child(6){ left: 75%; width: 110px; height: 110px; animation-delay: 3s; }
        .circles li:nth-child(7){ left: 35%; width: 150px; height: 150px; animation-delay: 7s; }
        .circles li:nth-child(8){ left: 50%; width: 25px; height: 25px; animation-delay: 15s; animation-duration: 45s; }
        .circles li:nth-child(9){ left: 20%; width: 15px; height: 15px; animation-delay: 2s; animation-duration: 35s; }
        .circles li:nth-child(10){ left: 85%; width: 150px; height: 150px; animation-delay: 0s; animation-duration: 11s; }

        @keyframes animate {
            0%{ transform: translateY(0) rotate(0deg); opacity: 1; border-radius: 0; }
            100%{ transform: translateY(-1000px) rotate(720deg); opacity: 0; border-radius: 50%; }
        }

        /* --- MAIN CONTENT --- */
        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            background: linear-gradient(to right, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(96, 165, 250, 0.4);
            margin-bottom: 5px;
            z-index: 10;
        }

        /* Glassmorphism Card */
        .main-container {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 500px;
        }

        #timer {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            color: #fbbf24;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(251, 191, 36, 0.5);
        }

        /* Cube Grid */
        .cube-container {
            display: grid;
            grid-template-columns: 60px 60px 60px 60px;
            grid-template-rows: 60px 60px 60px;
            gap: 6px;
            justify-content: center;
            margin: 20px auto;
        }

        .face {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 1px;
            width: 60px;
            height: 60px;
            background: rgba(0,0,0,0.5);
            padding: 2px;
            border-radius: 4px;
        }

        #face-0 { grid-column: 2; grid-row: 1; }
        #face-5 { grid-column: 1; grid-row: 2; }
        #face-2 { grid-column: 2; grid-row: 2; }
        #face-4 { grid-column: 3; grid-row: 2; }
        #face-3 { grid-column: 4; grid-row: 2; }
        #face-1 { grid-column: 2; grid-row: 3; }

        .sticker { width: 100%; height: 100%; border-radius: 2px; transition: all 0.3s; }

        /* Buttons */
        .controls { margin-top: 25px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        button {
            padding: 12px 20px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            color: white;
            transition: transform 0.2s, box-shadow 0.3s;
            position: relative;
            overflow: hidden;
        }
        button:hover { transform: translateY(-3px); }
        button:active { transform: scale(0.95); }
        
        .btn-scramble { background: linear-gradient(135deg, #f59e0b, #d97706); box-shadow: 0 0 15px rgba(245,158,11,0.4); }
        .btn-ai { background: linear-gradient(135deg, #3b82f6, #2563eb); box-shadow: 0 0 15px rgba(59,130,246,0.4); }
        .btn-fast { background: linear-gradient(135deg, #10b981, #059669); box-shadow: 0 0 15px rgba(16,185,129,0.4); }

        /* Move Chips */
        .moves-container {
            margin-top: 20px; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px;
        }
        .move-badge {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #60a5fa;
            padding: 4px 10px;
            border-radius: 6px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            animation: popIn 0.3s ease forwards;
            opacity: 0;
        }
        @keyframes popIn { to { transform: scale(1); opacity: 1; } }

    </style>
</head>
<body>

    <div class="area" >
        <ul class="circles">
            <li></li><li></li><li></li><li></li><li></li>
            <li></li><li></li><li></li><li></li><li></li>
        </ul>
    </div >

    <audio id="snd-move" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3"></audio>
    <audio id="snd-win" src="https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3"></audio>
    <audio id="snd-scramble" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"></audio>

    <div class="main-container" id="mainCard">
        <h1>🧩 AI Rubik's Solver</h1>
        <div id="timer">00.000s</div>
        <div id="status" style="height: 20px; color: #cbd5e1; margin-bottom: 10px; font-weight: 300;">Ready to Solve</div>

        <div class="cube-container">
            <div id="face-0" class="face"></div>
            <div id="face-5" class="face"></div>
            <div id="face-2" class="face"></div>
            <div id="face-4" class="face"></div>
            <div id="face-3" class="face"></div>
            <div id="face-1" class="face"></div>
        </div>

        <div class="controls">
            <button class="btn-scramble" onclick="startScramble()">🎲 Scramble</button>
            <button class="btn-ai" onclick="runSolver('/solve-custom', 'Thinking...')">🧠 Brain Solve</button>
            <button class="btn-fast" onclick="runSolver('/solve-fast', 'Calculating...')">⚡ Instant Solve</button>
        </div>
    </div>

    <script>
        const colors = { 0: '#ffffff', 1: '#fbbf24', 2: '#4ade80', 3: '#60a5fa', 4: '#f87171', 5: '#fb923c' };

        const playSound = (id) => {
            const audio = document.getElementById(id);
            if(audio) { audio.currentTime = 0; audio.volume = 0.4; audio.play().catch(e=>{}); }
        }

        let startTime, timerInterval;
        function startTimer() {
            clearInterval(timerInterval); startTime = Date.now();
            timerInterval = setInterval(() => {
                document.getElementById('timer').innerText = ((Date.now() - startTime) / 1000).toFixed(3) + 's';
            }, 50);
        }
        function stopTimer() { clearInterval(timerInterval); }

        function initGrid() {
            [0, 5, 2, 4, 3, 1].forEach(f => {
                const faceDiv = document.getElementById(`face-${f}`);
                faceDiv.innerHTML = '';
                for(let i=0; i<9; i++) {
                    let div = document.createElement('div');
                    div.className = 'sticker';
                    div.style.backgroundColor = colors[f];
                    div.id = `f${f}-c${i}`;
                    faceDiv.appendChild(div);
                }
            });
        }

        function updateCube(state) {
            playSound('snd-move'); 
            for(let f=0; f<6; f++) {
                let flatIndex = 0;
                for(let r=0; r<3; r++) {
                    for(let c=0; c<3; c++) {
                        let sticker = document.getElementById(`f${f}-c${flatIndex}`);
                        sticker.style.backgroundColor = colors[state[f][r][c]];
                        flatIndex++;
                    }
                }
            }
        }

        async function startScramble() {
            let old = document.querySelector('.moves-container'); if(old) old.remove();
            playSound('snd-scramble');
            document.getElementById('status').innerText = "Scrambling...";
            document.getElementById('timer').innerText = "00.000s";
            
            let res = await fetch('/scramble');
            let data = await res.json();
            updateCube(data.state);
            document.getElementById('status').innerText = `Scrambled (${data.moves_made.length} moves)`;
        }

        async function runSolver(endpoint, text) {
            document.getElementById('status').innerText = text;
            let old = document.querySelector('.moves-container'); if(old) old.remove();
            startTimer();
            
            try {
                let res = await fetch(endpoint);
                let data = await res.json();
                stopTimer();
                
                if(data.error) {
                    document.getElementById('status').innerText = data.error;
                } else {
                    document.getElementById('status').innerText = `Solved in ${data.solution.length} moves!`;
                    initGrid(); // Visual Reset
                    
                    // Create Move Chips
                    let movesDiv = document.createElement('div');
                    movesDiv.className = 'moves-container';
                    data.solution.forEach((move, i) => {
                        let badge = document.createElement('span');
                        badge.className = 'move-badge';
                        badge.innerText = move;
                        badge.style.animationDelay = `${i * 50}ms`;
                        movesDiv.appendChild(badge);
                    });
                    document.getElementById('mainCard').appendChild(movesDiv);
                    
                    triggerParty();
                }
            } catch (e) {
                stopTimer();
                document.getElementById('status').innerText = "Connection Error!";
            }
        }

        function triggerParty() {
            playSound('snd-win');
            var duration = 3000;
            var end = Date.now() + duration;
            (function frame() {
                confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 } });
                confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 } });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());
        }

        initGrid();
    </script>
</body>
</html>
